name: Build and Deploy Astro Site

on:
   push:
      branches:
         - main
   workflow_dispatch:

# Least privilege: the job only needs to push the built output to `build`.
permissions:
   contents: write

# A newer push supersedes an in-flight deploy of the same branch.
concurrency:
   group: pages-${{ github.ref }}
   cancel-in-progress: true

jobs:
   build-and-deploy:
      runs-on: ubuntu-latest
      name: "Verify, build and push to build branch"

      steps:
         - name: Checkout code
           uses: actions/checkout@v5

         - name: Setup Node
           uses: actions/setup-node@v6
           with:
              # Single source of truth for the Node version, shared with local dev.
              node-version-file: .nvmrc
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Type check
           run: npm run check

         - name: Lint and format check
           run: npm run lint

         - name: Install Playwright browser
           run: npx playwright install --with-deps chromium

         - name: Smoke tests
           run: npm test

         - name: Upload test report
           if: failure()
           uses: actions/upload-artifact@v4
           with:
              name: playwright-report
              path: |
                 test-results/
                 playwright-report/
              retention-days: 7

         - name: Upload npm logs
           if: failure()
           uses: actions/upload-artifact@v4
           with:
              name: npm-debug-log
              path: /home/runner/.npm/_logs/*.log

         - name: Build
           run: npm run build

         - name: Push
           uses: s0/git-publish-subdir-action@v2.6.0
           env:
              REPO: self
              BRANCH: build
              FOLDER: dist
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              MESSAGE: "Build: ({sha}) {msg}"
