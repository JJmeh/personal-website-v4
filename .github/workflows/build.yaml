name: Build and Deploy Astro Site

on:
   push:
      branches:
         - main

jobs:
   build-and-deploy:
      runs-on: ubuntu-latest
      name: "Build and Push to Build branch"

      steps:
         # Step 1: Checkout the repository
         - name: Checkout code
           uses: actions/checkout@v5

         # Step 2: Set up Node (with dependency caching)
         - name: Setup Node
           uses: actions/setup-node@v6
           with:
              node-version: 24
              cache: npm

         # Step 3: Install dependencies (reproducible via package-lock.json)
         - name: Install dependencies
           run: npm ci

         #  # Step 4: Restore the Astro build cache.
         #  # Encoding the responsive variants of ~130 photos costs ~2m15s of a
         #  # 2m20s build (98%); a warm cache turns that into ~0.2s. Entries are
         #  # keyed by the source file's content hash plus the transform options,
         #  # so a cache hit is always valid and a partial restore still reuses
         #  # every image that did not change.
         #  # NOTE: Astro's variant hash covers only the transform — neither the
         #  # image service config (`quality`/`effort`/formats) nor the Astro/sharp
         #  # version are part of it, so those go into the key *prefix*: changing
         #  # them rotates the prefix, the `restore-keys` fallback stops matching
         #  # and everything is re-encoded with the new options. Editing only
         #  # images keeps the prefix and reuses the previous cache, encoding just
         #  # the new files.
         #  # `npm ci` above wipes node_modules, hence cacheDir lives at the repo
         #  # root (see astro.config.mjs).
         #  - name: Cache generated images and fonts
         #    uses: actions/cache@v6
         #    with:
         #       path: .astro-cache
         #       key: astro-cache-${{ runner.os }}-${{ hashFiles('astro.config.mjs', 'package-lock.json') }}-${{ hashFiles('src/assets/**') }}
         #       restore-keys: |
         #          astro-cache-${{ runner.os }}-${{ hashFiles('astro.config.mjs', 'package-lock.json') }}-

         # Step 5: Static checks
         #  - name: Type check
         #    run: npm run check

         #  - name: Lint
         #    run: npm run lint

         - name: Upload npm logs
           if: failure()
           uses: actions/upload-artifact@v4
           with:
              name: npm-debug-log
              path: /home/runner/.npm/_logs/*.log

         # Step 6: Build the project
         - name: Build
           run: npm run build

         # Step 7: Push build output to the "build" branch
         - name: Push
           uses: s0/git-publish-subdir-action@v2.6.0
           env:
              REPO: self
              BRANCH: build
              FOLDER: dist
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              MESSAGE: "Build: ({sha}) {msg}"
